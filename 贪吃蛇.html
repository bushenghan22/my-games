<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}

.game-wrapper {
  text-align: center;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding: 0 5px;
}

.score-box {
  color: #e94560;
  font-size: 20px;
  letter-spacing: 2px;
}

.score-box span {
  color: #eee;
  font-size: 28px;
  font-weight: bold;
}

.best-box {
  color: #888;
  font-size: 14px;
}
.best-box span { color: #aaa; font-weight: bold; }

canvas {
  display: block;
  border: 2px solid #e94560;
  border-radius: 4px;
  box-shadow: 0 0 20px rgba(233,69,96,0.15);
}

.controls {
  margin-top: 20px;
  display: grid;
  grid-template-columns: 60px 60px 60px;
  grid-template-rows: 60px 60px 60px;
  gap: 6px;
  justify-content: center;
}

.controls button {
  background: #16213e;
  border: 1px solid #e94560;
  color: #e94560;
  font-size: 24px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.controls button:active {
  background: #e94560;
  color: #fff;
}

.btn-up    { grid-column: 2; grid-row: 1; }
.btn-left  { grid-column: 1; grid-row: 2; }
.btn-right { grid-column: 3; grid-row: 2; }
.btn-down  { grid-column: 2; grid-row: 3; }

.hint {
  color: #444;
  margin-top: 15px;
  font-size: 12px;
  letter-spacing: 1px;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.overlay.hidden { display: none; }

.overlay-box {
  background: #1a1a2e;
  border: 2px solid #e94560;
  border-radius: 12px;
  padding: 40px 50px;
  text-align: center;
}

.overlay-box h2 {
  color: #e94560;
  font-size: 28px;
  margin-bottom: 10px;
}

.overlay-box .final-score {
  color: #eee;
  font-size: 48px;
  margin: 10px 0;
}

.overlay-box button {
  margin-top: 20px;
  padding: 10px 40px;
  font-size: 18px;
  background: #e94560;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 1px;
  font-family: inherit;
  transition: background 0.2s;
}

.overlay-box button:hover { background: #ff6b81; }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <div class="score-box">分数 <span id="score">0</span></div>
    <div class="best-box">最高 <span id="best">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button class="btn-up" id="btnUp">▲</button>
    <button class="btn-left" id="btnLeft">◀</button>
    <button class="btn-right" id="btnRight">▶</button>
    <button class="btn-down" id="btnDown">▼</button>
  </div>
  <div class="hint">键盘方向键 或 按钮控制 | 按 R 重新开始</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle">贪吃蛇</h2>
    <div class="final-score" id="overlayScore">0</div>
    <p style="color:#888;">按 空格键 开始</p>
    <button id="overlayBtn">开始游戏</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayScore = document.getElementById('overlayScore');
const overlayBtn = document.getElementById('overlayBtn');

const GRID = 20;
const COLS = 20;
const ROWS = 20;
const W = COLS * GRID;
const H = ROWS * GRID;
canvas.width = W;
canvas.height = H;

let snake, food, direction, nextDirection, score, best, gameLoop, running, speed;

best = parseInt(localStorage.getItem('snakeBest') || '0');
bestEl.textContent = best;

function init() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  speed = 120;
  scoreEl.textContent = '0';
  placeFood();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      ctx.fillStyle = '#1e1e36';
      ctx.fillRect(x * GRID + 1, y * GRID + 1, GRID - 2, GRID - 2);
    }
  }

  snake.forEach((s, i) => {
    const alpha = 1 - (i / snake.length) * 0.5;
    ctx.fillStyle = i === 0
      ? '#e94560'
      : `rgba(22, 33, 62, ${0.4 + alpha * 0.6})`;
    ctx.shadowColor = i === 0 ? '#e94560' : 'transparent';
    ctx.shadowBlur = i === 0 ? 6 : 0;
    ctx.fillRect(s.x * GRID + 2, s.y * GRID + 2, GRID - 4, GRID - 4);
    ctx.shadowBlur = 0;
  });

  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function update() {
  direction = { ...nextDirection };
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (speed > 50) { speed -= 2; resetLoop(); }
  } else {
    snake.pop();
  }

  draw();
}

function resetLoop() {
  clearInterval(gameLoop);
  gameLoop = setInterval(update, speed);
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    bestEl.textContent = best;
  }
  overlayTitle.textContent = '游戏结束';
  overlayScore.textContent = score;
  overlayBtn.textContent = '再来一局';
  overlay.classList.remove('hidden');
}

function startGame() {
  init();
  overlay.classList.add('hidden');
  running = true;
  draw();
  resetLoop();
}

function setDir(dx, dy) {
  if (!running) return;
  if (direction.x + dx === 0 && direction.y + dy === 0) return;
  nextDirection = { x: dx, y: dy };
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0, -1); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1, 0); break;
    case 'r': case 'R': clearInterval(gameLoop); startGame(); break;
    case ' ': if (!running) { e.preventDefault(); startGame(); } break;
  }
});

document.getElementById('btnUp').addEventListener('click', () => setDir(0, -1));
document.getElementById('btnDown').addEventListener('click', () => setDir(0, 1));
document.getElementById('btnLeft').addEventListener('click', () => setDir(-1, 0));
document.getElementById('btnRight').addEventListener('click', () => setDir(1, 0));

overlayBtn.addEventListener('click', startGame);

init();
draw();
</script>

</body>
</html>
